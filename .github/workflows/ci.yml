name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]"

      - name: Run tests
        run: pytest -q

      - name: Check Python compilation
        run: python -m compileall -q app.py src scripts

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check command-line entry point
        run: voice-agent-eval --help

  public-recording-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download and verify public contact-center recording
        run: |
          python scripts/download_public_sample.py --output /tmp/contact-center-sample.mp3

      - name: Exercise real MP3 decoding and acoustic feature extraction
        run: |
          python scripts/public_sample_smoke.py \
            /tmp/contact-center-sample.mp3 \
            --output /tmp/public-sample-preflight.json
          cat /tmp/public-sample-preflight.json
